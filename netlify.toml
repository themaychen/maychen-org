# Stray copies of the page left behind by earlier uploads (index_2 has the
# previous price bands). Send anyone who lands on them to the live page.
# force = true makes this work even though the files still exist in the repo.
[[redirects]]
  from = "/index_2.html"
  to = "/"
  status = 301
  force = true

